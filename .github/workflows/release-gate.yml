  w3-lifecycle-windows:
    name: "W3 lifecycle / Windows EXE+Setup (G6)"
    if: ${{ inputs.run_w3_lifecycle_windows }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout (full history + tags for v1.0.5 baseline)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build frontend once
        shell: pwsh
        run: |
          python scripts/release/build_frontend.py
          if ($LASTEXITCODE -ne 0) { throw "frontend single build failed" }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }

      - name: Build v1.0.6 strict Windows artifacts
        shell: cmd
        run: deploy\build-windows.bat --release

      - name: Prepare v1.0.5 portable fixture (reconstructed from tag)
        shell: pwsh
        run: |
          $fixtureDir = Join-Path $env:RUNNER_TEMP "v105-fixture"
          git worktree add $fixtureDir v1.0.5
          # 启动编码垫片（等价 v1.0.6 的 desktop_main 入口 reconfigure 修复）：
          # PyInstaller bootloader 对 frozen app 隔离 PYTHONIOENCODING/PYTHONUTF8
          # （W3 CI 十二~十五轮 env 注入全路线实证无效），v1.0.5 lifespan 的
          # 中文 print 在 cp1252 stderr 句柄上崩启动链。与 Linux 夹具带 R9
          # 热修同型（reconstructed 夹具允许编码热修，不改业务行为）。
          $dm = Join-Path $fixtureDir "backend\app\desktop_main.py"
          $src = Get-Content $dm -Raw -Encoding UTF8
          $anchor = 'os.environ.setdefault("ALLOWED_HOSTS"'
          $idx = $src.IndexOf($anchor)
          if ($idx -lt 0) { throw "desktop_main anchor not found" }
          $lineEnd = $src.IndexOf("`n", $idx)
          $shim = @'

          # W3 CI 夹具垫片（reconstructed）：启动编码热修，等价 v1.0.6 修复
          import sys as _sys
          if _sys.stdout is None and _sys.stderr is not None:
              _sys.stdout = _sys.stderr
          for _s in (_sys.stdout, _sys.stderr):
              if hasattr(_s, "reconfigure"):
                  _s.reconfigure(encoding="utf-8", errors="replace")
          '@
          $patched = $src.Insert($lineEnd + 1, $shim + "`n")
          Set-Content $dm -Value $patched -Encoding UTF8 -NoNewline
          Write-Output "v1.0.5 fixture encoding shim applied"
          Push-Location "$fixtureDir/frontend"
          $npm = (Get-Command npm.cmd).Source
          & $npm ci --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { throw "v1.0.5 npm ci failed" }
          & $npm run build
          if ($LASTEXITCODE -ne 0) { throw "v1.0.5 npm build failed" }
          Pop-Location
          Push-Location $fixtureDir
          & python -m venv .venv-v105
          & .venv-v105\Scripts\python.exe -m pip install -q --prefer-binary -r deploy\requirements-windows-package.txt
          if ($LASTEXITCODE -ne 0) { throw "v1.0.5 packaging deps failed" }
          & .venv-v105\Scripts\pyinstaller.exe --clean --noconfirm deploy\btdeck-windows.spec
          if ($LASTEXITCODE -ne 0) { throw "v1.0.5 pyinstaller failed" }
          Pop-Location
          "V105_FIXTURE=$(Join-Path $fixtureDir 'dist/btdeck.exe')" | Add-Content -Path $env:GITHUB_ENV

      - name: Run Windows lifecycle scenarios (fail-closed)
        shell: pwsh
        run: |
          $fixture = if ($env:V105_FIXTURE -and (Test-Path $env:V105_FIXTURE)) { $env:V105_FIXTURE } else { "" }
          pwsh -File scripts\release\lifecycle\windows.ps1 -V105PortableExe $fixture
          if ($LASTEXITCODE -ne 0) { throw "windows lifecycle failed" }

      - name: Upload lifecycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-lifecycle-windows
          path: |
            w3-lifecycle-windows.json
            dist/btdeck.exe
            dist/BtDeck-v*-windows-x64-setup.exe
          retention-days: 7
          if-no-files-found: error

  w4-contract:
    name: "W4 contract / Cross-artifact equivalence (G8, C01~C12 + mutation drill)"
    if: ${{ inputs.run_w4_contract }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Checkout (full history for release identity)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build frontend once
        run: python scripts/release/build_frontend.py

      - name: Build strict Linux packages (DEB + RPM)
        run: |
          docker build -t w2-linux-builder - <<'BUILDEREOF'
          FROM python:3.11-bullseye
          RUN apt-get update && apt-get install -y --no-install-recommends \
                ruby ruby-dev build-essential git nodejs npm rpm rpm2cpio cpio \
              && rm -rf /var/lib/apt/lists/* \
              && gem install fpm --no-document
          BUILDEREOF
          docker run --rm -v "$PWD:/src" -w /src w2-linux-builder bash -c '
            set -e
            git config --global --add safe.directory /src
            bash deploy/build-linux.sh --release
          '

      - name: Build v1.0.6 docker images
        run: bash build-images.sh --release

      - name: Snapshot DEB / RPM / Docker instances (C01~C12 + restart C10)
        run: |
          set -e
          mkdir -p release/evidence/w4
          # systemd 测试容器（同 run_deb_rpm.sh 官方源配方，预装 python3 供 runner 使用）
          docker build -t w4-debian-sysd - <<'DEBEOF'
          FROM debian:12
          RUN apt-get update && apt-get install -y --no-install-recommends systemd curl sqlite3 iproute2 python3 \
              && ln -sf /lib/systemd/systemd /sbin/init \
              && rm -f /etc/machine-id
          CMD ["/sbin/init"]
          DEBEOF
          docker build -t w4-rocky-sysd - <<'RPMEOF'
          FROM rockylinux:9
          RUN dnf -y install systemd sqlite iproute python3 --allowerasing \
              && rm -f /etc/machine-id \
              && systemctl set-default multi-user.target
          CMD ["/sbin/init"]
          RPMEOF

          # 受控下载器 stub（B2）：单容器三监听（qB:18080 / TR:18081 / qB:18082
          # C05 专用——下载器缓存按 host:port 去重且 delete 不清缓存，C05/C06
          # 共端口会让 C06 夹具进不了缓存，本地双实例实证）。先接 deb 网再接
          # rpm 网，network-alias w4-stub 即各网 DNS 名。容器名须区别于 compose
          # 组合的 w4-stub 服务（container_name 固定，重名冲突 CI 第一轮实测）。
          docker network create w4net-deb >/dev/null 2>&1 || true
          docker network create w4net-rpm >/dev/null 2>&1 || true
          docker rm -f w4-stub-host >/dev/null 2>&1 || true
          docker run -d --name w4-stub-host --network w4net-deb --network-alias w4-stub \
            -v "$PWD/scripts/release/fixtures/qb_tr_stub.py:/stub/qb_tr_stub.py:ro" \
            python:3.11-slim sh -c 'python /stub/qb_tr_stub.py --role qb --port 18080 & python /stub/qb_tr_stub.py --role tr --port 18081 & python /stub/qb_tr_stub.py --role qb --port 18082 & wait' >/dev/null
          docker network connect --alias w4-stub w4net-rpm w4-stub-host

          # 等待逻辑用仓库内脚本文件（scripts/release/lifecycle/w4_install_wait.sh）：
          # docker exec 嵌套引号转义链与 YAML 块内 heredoc 均不可靠（CI 首两轮
          # 实测），安装命令不可作单参数传（"dpkg -i" 成单命令名→127，第三轮
          # 实测）——脚本按包文件后缀分支，函数只传包路径。
          # 每实例两阶段：FULL（C01~C09/C11/C12）→ systemctl restart → C10
          # （重启后契约密码登录/数据可见/身份不变）--merge-into 并入主快照。
          snapshot_pkg() {  # snapshot_pkg <name> <image> <pkg-file> <net>
            local name="$1" image="$2" pkg="$3" net="$4"
            docker rm -f "w4-$name" >/dev/null 2>&1 || true
            docker run -d --name "w4-$name" --privileged --cgroupns=host --network "$net" -v "$PWD:/src:ro" "$image" >/dev/null
            sleep 8
            docker exec "w4-$name" bash /src/scripts/release/lifecycle/w4_install_wait.sh "$pkg"
            docker exec "w4-$name" python3 /src/scripts/release/contract_runner.py \
              --base-url http://127.0.0.1:5001 --scenario-set FULL --downloader-stub-host w4-stub \
              --output "/tmp/snapshot-$name.json"
            docker exec "w4-$name" systemctl restart btdeck
            docker exec "w4-$name" bash /src/scripts/release/lifecycle/w4_install_wait.sh --wait-only
            docker exec "w4-$name" python3 /src/scripts/release/contract_runner.py \
              --base-url http://127.0.0.1:5001 --scenarios C10 --downloader-stub-host w4-stub \
              --output "/tmp/c10-$name.json" --merge-into "/tmp/snapshot-$name.json"
            docker cp "w4-$name:/tmp/snapshot-$name.json" "release/evidence/w4/snapshot-$name.json"
            docker rm -f "w4-$name" >/dev/null
          }

          snapshot_pkg deb w4-debian-sysd "/src/dist/BtDeck-v1.0.6-linux-amd64.deb" w4net-deb
          # rpm 与 deb 用不同 systemd 容器（发行版覆盖）
          snapshot_pkg rpm w4-rocky-sysd "/src/dist/BtDeck-v1.0.6-linux-amd64.rpm" w4net-rpm

          # Docker 组合快照（backend 容器内执行 runner；stub 由 w4-stub override
          # 提供同网服务）。w4-override 对齐生产形态（DEV=false+测试 SECRET_KEY）
          # ——compose 默认 DEV=true 会开 openapi，与 deb/rpm 生产形态不一致造成
          # C02 伪差异（第九轮实测 route_count 0 vs 191 共 216 条）。
          # 组合保持运行：后续 Mutation drill 步骤复用该组合。
          BTDECK_BACKEND_IMAGE=btdeck-backend:v1.0.6 BTDECK_FRONTEND_IMAGE=btdeck-frontend:v1.0.6 \
            docker compose -f scripts/release/lifecycle/docker-compose.test.yml \
              -f scripts/release/lifecycle/docker-compose.w4-override.yml \
              -f scripts/release/lifecycle/docker-compose.w4-stub.yml -p w4life up -d
          for i in $(seq 1 60); do
            body=$(docker exec w3-life-backend curl -fsS http://localhost:5001/health/live 2>/dev/null || true)
            case "$body" in *'"version":"1.0.6"'*) break;; esac
            sleep 3
          done
          if [ "$i" = "60" ]; then
            echo 'docker backend not healthy; last logs:'
            docker logs w3-life-backend 2>&1 | tail -15
            exit 1
          fi
          docker cp scripts/release/contract_runner.py w3-life-backend:/tmp/contract_runner.py
          docker exec w3-life-backend python3 /tmp/contract_runner.py \
            --base-url http://127.0.0.1:5001 --scenario-set FULL --downloader-stub-host w4-stub \
            --spa-base-url http://w3-life-frontend --output /tmp/snapshot-docker.json
          BTDECK_BACKEND_IMAGE=btdeck-backend:v1.0.6 BTDECK_FRONTEND_IMAGE=btdeck-frontend:v1.0.6 \
            docker compose -f scripts/release/lifecycle/docker-compose.test.yml \
              -f scripts/release/lifecycle/docker-compose.w4-override.yml \
              -f scripts/release/lifecycle/docker-compose.w4-stub.yml -p w4life restart btdeck-backend
          for i in $(seq 1 60); do
            body=$(docker exec w3-life-backend curl -fsS http://localhost:5001/health/live 2>/dev/null || true)
            case "$body" in *'"version":"1.0.6"'*) break;; esac
            sleep 3
          done
          docker exec w3-life-backend python3 /tmp/contract_runner.py \
            --base-url http://127.0.0.1:5001 --scenarios C10 --downloader-stub-host w4-stub \
            --output /tmp/c10-docker.json --merge-into /tmp/snapshot-docker.json
          docker cp w3-life-backend:/tmp/snapshot-docker.json release/evidence/w4/snapshot-docker.json

      - name: Compare cross-artifact snapshots (fail-closed)
        run: |
          # pipefail 必需：| tee 会吞 compare 的非零退出码（第九轮 job 伪绿实测）
          set -o pipefail
          python scripts/release/compare_snapshots.py \
            --baseline release/evidence/w4/snapshot-deb.json \
            --candidates release/evidence/w4/snapshot-rpm.json release/evidence/w4/snapshot-docker.json \
            --exceptions release/equivalence-exceptions.json \
            | tee release/evidence/w4/compare-report.json

      - name: Mutation drill (G8 exit gate) - injected diffs must go red
        run: |
          set -e
          # G8 退出门（计划 §W4）：对真实运行制品注入差异，聚合比对必须报红；
          # 演练步骤断言"检出"——变异未被拦截时本步骤失败。复用仍在运行的
          # w4life docker 组合（backend 完好；M1 只改 frontend 静态资源）。
          # ---- M1 前端资源变异（真制品差异：index.html 前置标记字节） ----
          docker exec w3-life-frontend sh -c "sed -i '1s/^/<!-- w4-mutation -->/' /usr/share/nginx/html/index.html"
          docker exec w3-life-backend python3 /tmp/contract_runner.py \
            --base-url http://127.0.0.1:5001 --scenarios C11 --spa-base-url http://w3-life-frontend \
            --output /tmp/m1-mutated-c11.json
          docker cp w3-life-backend:/tmp/m1-mutated-c11.json release/evidence/w4/m1-mutated-c11.json
          python scripts/release/slice_snapshot.py --input release/evidence/w4/snapshot-docker.json \
            --scenarios C11_spa --output /tmp/m1-baseline-c11.json
          if python scripts/release/compare_snapshots.py --baseline /tmp/m1-baseline-c11.json \
              --candidates release/evidence/w4/m1-mutated-c11.json \
              --exceptions release/equivalence-exceptions.json > release/evidence/w4/m1-report.json; then
            echo '[FAIL] M1: 前端资源变异未被检出（compare 未报红）'; exit 1
          fi
          grep -q 'C11_spa.index' release/evidence/w4/m1-report.json \
            || { echo '[FAIL] M1: 报告缺 index 差异'; cat release/evidence/w4/m1-report.json; exit 1; }
          echo 'M1 PASS: 前端资源差异已按预期拦截'

          # ---- M2 响应字段变异（mutate-proxy 改写 /health/live 的 data.version） ----
          docker rm -f w4-mut-proxy >/dev/null 2>&1 || true
          docker run -d --name w4-mut-proxy --network w4life_w3life_net \
            -v "$PWD/scripts/release/fixtures/qb_tr_stub.py:/stub/qb_tr_stub.py:ro" \
            python:3.11-slim python /stub/qb_tr_stub.py --role mutate-proxy --port 5002 \
            --upstream http://w3-life-backend:5001 --mutate-route /health/live \
            --mutate-field data.version --mutate-value 1.0.6-mutated >/dev/null
          sleep 2
          docker run --rm --network w4life_w3life_net \
            -v "$PWD/release/evidence/w4:/out" \
            -v "$PWD/scripts/release/contract_runner.py:/runner/contract_runner.py:ro" \
            python:3.11-slim python /runner/contract_runner.py \
            --base-url http://w4-mut-proxy:5002 --scenarios C01 --output /out/m2-mutated-c01.json
          python scripts/release/slice_snapshot.py --input release/evidence/w4/snapshot-docker.json \
            --scenarios C01_health_identity --output /tmp/m2-baseline-c01.json
          if python scripts/release/compare_snapshots.py --baseline /tmp/m2-baseline-c01.json \
              --candidates release/evidence/w4/m2-mutated-c01.json \
              --exceptions release/equivalence-exceptions.json > release/evidence/w4/m2-report.json; then
            echo '[FAIL] M2: 响应字段变异未被检出（compare 未报红）'; exit 1
          fi
          grep -q 'live.identity.version' release/evidence/w4/m2-report.json \
            || { echo '[FAIL] M2: 报告缺 version 差异'; cat release/evidence/w4/m2-report.json; exit 1; }
          echo 'M2 PASS: 响应字段差异已按预期拦截'

          docker rm -f w4-mut-proxy >/dev/null 2>&1 || true
          BTDECK_BACKEND_IMAGE=btdeck-backend:v1.0.6 BTDECK_FRONTEND_IMAGE=btdeck-frontend:v1.0.6 \
            docker compose -f scripts/release/lifecycle/docker-compose.test.yml \
              -f scripts/release/lifecycle/docker-compose.w4-override.yml \
              -f scripts/release/lifecycle/docker-compose.w4-stub.yml -p w4life down -v >/dev/null
          docker rm -f w4-stub-host >/dev/null 2>&1 || true
          docker network rm w4net-deb w4net-rpm >/dev/null 2>&1 || true

      - name: Upload contract snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w4-contract
          path: release/evidence/w4/
          retention-days: 14
          if-no-files-found: error

  w5-security:
    name: "W5 security / SBOM + vuln/secret/license scan (G9)"
    if: ${{ inputs.run_w5_security }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build frontend once
        run: python scripts/release/build_frontend.py

      - name: Build strict Linux packages (DEB + RPM)
        run: |
          docker build -t w2-linux-builder - <<'BUILDEREOF'
          FROM python:3.11-bullseye
          RUN apt-get update && apt-get install -y --no-install-recommends \
                ruby ruby-dev build-essential git nodejs npm rpm rpm2cpio cpio \
              && rm -rf /var/lib/apt/lists/* \
              && gem install fpm --no-document
          BUILDEREOF
          docker run --rm -v "$PWD:/src" -w /src w2-linux-builder bash -c '
            set -e
            git config --global --add safe.directory /src
            bash deploy/build-linux.sh --release
          '

      - name: Build v1.0.6 docker images
        run: bash build-images.sh --release

      - name: Generate SBOMs (five targets, digest-pinned syft)
        run: python scripts/release/generate_sbom.py

      - name: Scan vulnerabilities + secrets + licenses (fail-closed)
        run: python scripts/release/scan_security.py

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w5-security
          path: |
            release/evidence/w5/
            release/build/sbom/index.json
          retention-days: 14
          if-no-files-found: error

  w5-sign-windows:
    name: "W5 sign / Windows Authenticode (G9 signing face)"
    if: ${{ inputs.run_w5_sign }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BTDECK_TIMESTAMP_URL: http://timestamp.digicert.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build frontend once (single build + manifest)
        shell: pwsh
        run: |
          python scripts/release/build_frontend.py
          if ($LASTEXITCODE -ne 0) { throw "frontend single build failed" }

      - name: Ensure Inno Setup available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }

      - name: Run deploy/build-windows.bat --release (fail-closed)
        shell: cmd
        run: deploy\build-windows.bat --release

      - name: Sign Windows artifacts (fail-closed; BLOCKED without cert)
        shell: pwsh
        env:
          BTDECK_SIGN_PFX_B64: ${{ secrets.BTDECK_SIGN_PFX_B64 }}
          BTDECK_SIGN_PFX_PASSWORD: ${{ secrets.BTDECK_SIGN_PFX_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: |
          $signArgs = @("scripts/release/sign_artifacts.py", "--target", "windows")
          if ("${{ inputs.allow_unsigned_drill }}" -eq "true") { $signArgs += "--allow-unsigned-drill" }
          python @signArgs
          if ($LASTEXITCODE -ne 0) {
            throw "windows signing rc=$LASTEXITCODE (2=SIGNING_BLOCKED cert missing; 3=SIGN_FAILED) - fail-closed, drill via allow_unsigned_drill"
          }

      - name: Upload signing record + artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w5-sign-windows
          path: |
            dist/btdeck.exe
            dist/BtDeck-v*-windows-x64-setup.exe
            release/build/windows-exe/build-info.json
            release/build/windows-exe/frontend-asset-manifest.json
            release/build/signing-digests-windows.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload unique frontend build (single-build principle, consumed by w5-sign-docker)
        uses: actions/upload-artifact@v4
        with:
          name: w5-frontend-unique-build
          # 两路径 LCA=仓库根 → 结构原样保留（frontend/dist/** + release/build/frontend/**）
          path: |
            frontend/dist
            release/build/frontend/frontend-asset-manifest.json
          retention-days: 14
          if-no-files-found: error

  w5-sign-docker:
    name: "W5 sign / Docker cosign + release manifest (G9/G10)"
    if: ${{ inputs.run_w5_sign }}
    needs: w5-sign-windows
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (release tooling + jsonschema)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install manifest validation deps
        run: pip install jsonschema

      - name: Download Windows artifacts + signing record
        uses: actions/download-artifact@v4
        with:
          name: w5-sign-windows
          path: .

      - name: Consume unique frontend build (single-build principle; NO rebuild)
        # run 33757547345 实证：两次独立前端构建的 index.html/service-worker.js 漂移
        # （SW 构建非确定），G1 跨制品比对正确拦截——本 job 必须消费上游唯一构建
        uses: actions/download-artifact@v4
        with:
          name: w5-frontend-unique-build
          path: .

      - name: Verify consumed frontend dist matches its manifest
        run: |
          set -euo pipefail
          python scripts/release/check_prebuilt_frontend.py \
            release/build/frontend/frontend-asset-manifest.json frontend/dist

      - name: Build strict Linux packages (DEB + RPM)
        run: |
          docker build -t w2-linux-builder - <<'BUILDEREOF'
          FROM python:3.11-bullseye
          RUN apt-get update && apt-get install -y --no-install-recommends \
                ruby ruby-dev build-essential git nodejs npm rpm rpm2cpio cpio \
              && rm -rf /var/lib/apt/lists/* \
              && gem install fpm --no-document
          BUILDEREOF
          docker run --rm -v "$PWD:/src" -w /src w2-linux-builder bash -c '
            set -e
            git config --global --add safe.directory /src
            bash deploy/build-linux.sh --release
          '

      - name: Build v1.0.6 docker images
        run: bash build-images.sh --release

      - name: Install pinned cosign (sha256 from tool-versions.json)
        run: |
          set -euo pipefail
          read -r URL SHA < <(python -c "import json;t=json.load(open('release/tool-versions.json'))['tools']['cosign'];print(t['url'],t['sha256'])")
          curl -sL "$URL" -o /usr/local/bin/cosign
          echo "$SHA  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign
          cosign version | head -2

      - name: Sign docker images (fail-closed; BLOCKED without key)
        env:
          BTDECK_COSIGN_KEY_B64: ${{ secrets.BTDECK_COSIGN_KEY_B64 }}
          BTDECK_COSIGN_PASSWORD: ${{ secrets.BTDECK_COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          ARGS="--target docker --cosign-bin /usr/local/bin/cosign"
          if [ "${{ inputs.allow_unsigned_drill }}" = "true" ]; then ARGS="$ARGS --allow-unsigned-drill"; fi
          RC=0
          python scripts/release/sign_artifacts.py $ARGS || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::docker signing rc=$RC (2=SIGNING_BLOCKED key missing; 3=SIGN_FAILED) - fail-closed"
            exit "$RC"
          fi

      - name: Static verify (G1/G5 pre-manifest, writes gate-report)
        run: |
          docker run --rm -v "$PWD:/src" -w /src w2-linux-builder bash -c '
            set -e
            git config --global --add safe.directory /src
            python3 scripts/release/verify_release_bundle.py
          '

      - name: Build release manifest (approver left empty for human approval)
        run: python scripts/release/build_release_manifest.py --emit-compose-env

      - name: Final verify with manifest (G9 signing + G10 digest closure)
        run: |
          docker run --rm -v "$PWD:/src" -w /src w2-linux-builder bash -c '
            set -e
            git config --global --add safe.directory /src
            python3 scripts/release/verify_release_bundle.py --require-manifest
          '

      - name: Assert drill semantics (unsigned records => verdict INDETERMINATE)
        if: ${{ inputs.allow_unsigned_drill }}
        run: |
          set -euo pipefail
          VERDICT=$(python -c "import json;print(json.load(open('release/build/release-manifest.json'))['verdict'])")
          if [ "$VERDICT" != "INDETERMINATE" ]; then
            echo "::error::drill manifest verdict must be INDETERMINATE (got $VERDICT); CERTIFIED requires real signing + human approval"
            exit 1
          fi
          echo "drill semantics OK: verdict=$VERDICT"

      - name: Upload signing + manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w5-sign-docker
          path: |
            release/build/signing-digests-*.json
            release/build/signatures/
            release/build/release-manifest.json
            release/build/gate-report.json
            release/build/checksums.txt
            deploy/compose-release.env
          retention-days: 14
          if-no-files-found: error

  rc-gate:
    name: "RC gate / aggregate G0~G10 (fail-closed DAG)"
    if: ${{ inputs.run_rc_gate && !cancelled() }}
    needs:
      - w0-windows-runner
      - w0-linux-systemd
      - w0-node-matrix
      - w0-glibc-bullseye
      - w2-strict-linux-build
      - w2-strict-windows-build
      - w2-strict-docker-build
      - w3-lifecycle-linux
      - w3-lifecycle-docker
      - w3-lifecycle-windows
      - w4-contract
      - w5-security
      - w5-sign-windows
      - w5-sign-docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install aggregator deps
        run: pip install jsonschema

      - name: Assert upstream gate jobs all succeeded (skipped = NOT_RUN, fail-closed)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          results = {
              "w0-windows-runner": "${{ needs.w0-windows-runner.result }}",
              "w0-linux-systemd": "${{ needs.w0-linux-systemd.result }}",
              "w0-node-matrix": "${{ needs.w0-node-matrix.result }}",
              "w0-glibc-bullseye": "${{ needs.w0-glibc-bullseye.result }}",
              "w2-strict-linux-build": "${{ needs.w2-strict-linux-build.result }}",
              "w2-strict-windows-build": "${{ needs.w2-strict-windows-build.result }}",
              "w2-strict-docker-build": "${{ needs.w2-strict-docker-build.result }}",
              "w3-lifecycle-linux": "${{ needs.w3-lifecycle-linux.result }}",
              "w3-lifecycle-docker": "${{ needs.w3-lifecycle-docker.result }}",
              "w3-lifecycle-windows": "${{ needs.w3-lifecycle-windows.result }}",
              "w4-contract": "${{ needs.w4-contract.result }}",
              "w5-security": "${{ needs.w5-security.result }}",
              "w5-sign-windows": "${{ needs.w5-sign-windows.result }}",
              "w5-sign-docker": "${{ needs.w5-sign-docker.result }}",
          }
          bad = {k: v for k, v in results.items() if v != "success"}
          if bad:
              for name, result in sorted(bad.items()):
                  print(f"::error::upstream gate job {name} -> {result} (skipped/failure = NOT_RUN, fail-closed; dispatch all gate inputs in the same run)")
              raise SystemExit(1)
          print(f"all {len(results)} upstream gate jobs succeeded")
          PY

      - name: Download gate evidence artifacts (merged into natural paths)
        uses: actions/download-artifact@v4
        with:
          pattern: "w[0-9]-*"
          merge-multiple: true
          path: .

      - name: Map regression conclusion to G2/G3 fragments (fail-closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          curl -s -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&per_page=100" \
            -o /tmp/reg-runs.json
          CONCLUSION=$(python3 -c "
          import json
          runs = [r for r in json.load(open('/tmp/reg-runs.json')).get('workflow_runs', []) if r.get('name') == 'Full-stack regression']
          print(runs[0].get('conclusion') or 'NOT_FOUND' if runs else 'NOT_FOUND')
          ")
          echo "regression conclusion for ${SHA:0:12}: ${CONCLUSION}"
          STATUS=$([ "${CONCLUSION}" = "success" ] && echo PASS || echo NOT_RUN)
          mkdir -p release/build/gate-fragments
          python3 - <<PY
          import datetime, json
          note = "Full-stack regression conclusion: ${CONCLUSION} (head_sha=${SHA})"
          for gate in ("G2", "G3"):
              json.dump(
                  {
                      "gate": gate,
                      "status": "${STATUS}",
                      "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      "summary": note,
                      "evidence": [{"path": "regression workflow run (head_sha match)"}],
                  },
                  open(f"release/build/gate-fragments/{gate}.json", "w"),
                  indent=2,
              )
          PY
          cat release/build/gate-fragments/G2.json

      - name: Aggregate gate report (G0~G10)
        run: python3 scripts/release/aggregate_gate_report.py

      - name: Upload aggregated gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-gate
          path: |
            release/build/gate-report-full.json
            release/build/release-summary.md
            release/build/gate-fragments/
          retention-days: 30
          if-no-files-found: error

# BtDeck Release Gate（W0 探针阶段）
#
# 职责（PLANS/release-artifact-equivalence-gate.md §8.3 / §11 W0）：
#   w0-windows-runner : windows-2022 上验证 Inno Setup 安装/静默安装卸载 + NSSM 服务生命周期
#   w0-linux-systemd  : ubuntu Runner 上验证 Debian 12 / Rocky 9 systemd 特权容器拓扑
#   w0-node-matrix    : Node 22 下前端全量矩阵（contract:check/typecheck/Jest/build）
#   w0-glibc-bullseye : python:3.11-bullseye 构建 Linux 二进制并在两发行版运行验证
#
# 本文件当前只承载 W0 能力探针；G0～G10 完整门禁 DAG 在后续批次（W2+/W5）加入。
# 语义：fail-closed —— 任一探针失败/超时/证据缺失即 job 失败，不允许跳过。
# 触发：仅 workflow_dispatch（推送后手动触发；后续 RC 阶段再接 tag 触发）。
#
# 2026-08-28 本地等价探针已通过（见 release/evidence/w0/）：
#   - systemd 拓扑配方（含 debian:12 需补 /sbin/init 符号链接的细节）
#   - bullseye 单二进制在 rocky9/debian12 双发行版启动
#   - Node 22.23.2 前端 84 套件 1233 测试全绿
# 本 workflow 的目的是在 GitHub 托管 Runner 上复现同一配方，证明 CI 环境等效。

name: Release Gate

on:
  workflow_dispatch:
    inputs:
      run_windows:
        description: "Run w0-windows-runner probe"
        type: boolean
        default: true
      run_linux_systemd:
        description: "Run w0-linux-systemd probe"
        type: boolean
        default: true
      run_node_matrix:
        description: "Run w0-node-matrix probe"
        type: boolean
        default: true
      run_glibc:
        description: "Run w0-glibc-bullseye probe"
        type: boolean
        default: true
      run_w2_linux:
        description: "Run w2-strict-linux-build (G4/G5)"
        type: boolean
        default: false
      run_w2_windows:
        description: "Run w2-strict-windows-build (G4/G5)"
        type: boolean
        default: false
      run_w2_docker:
        description: "Run w2-strict-docker-build (G4/G5)"
        type: boolean
        default: false
      run_w3_lifecycle_linux:
        description: "Run w3-lifecycle-linux (G6 DEB/RPM)"
        type: boolean
        default: false
      run_w3_lifecycle_docker:
        description: "Run w3-lifecycle-docker (G6/G7)"
        type: boolean
        default: false
      run_w3_lifecycle_windows:
        description: "Run w3-lifecycle-windows (G6)"
        type: boolean
        default: false
      run_w4_contract:
        description: "Run w4-contract (G8 cross-artifact blackbox C01~C12 + mutation drill)"
        type: boolean
        default: false
      run_w5_security:
        description: "Run w5-security (G9 SBOM + vuln/secret/license scan)"
        type: boolean
        default: false
      run_w5_sign:
        description: "Run w5-sign-windows + w5-sign-docker (G9 signing + G10 release manifest)"
        type: boolean
        default: false
      allow_unsigned_drill:
        description: "Drill mode: signing secrets may be absent (records unsigned; verdict INDETERMINATE, never CERTIFIED)"
        type: boolean
        default: false
      run_rc_gate:
        description: "Run rc-gate (aggregate G0~G10, fail-closed DAG; requires all gate jobs in same run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  # W0 探针锁定的工具链（与 release/release-config.json 对齐；W1 起由 config 单一来源化）
  W0_NODE_VERSION: "22.23.2"
  W0_PYTHON_BUILD_IMAGE: python:3.11-bullseye
  W0_TEST_DISTROS: '["debian:12", "rockylinux:9"]'

jobs:
  w0-windows-runner:
    name: "W0 probe / Windows runner (Inno + NSSM lifecycle)"
    if: ${{ inputs.run_windows }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Inno Setup available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          } else {
            Write-Output "Inno Setup already preinstalled on runner"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $ver = (Get-Item $iscc).VersionInfo.ProductVersion
          if (-not $ver) { $ver = "0.0.0.0" }  # runner 预装版版本资源为空，记录占位
          Write-Output "ISCC_VERSION=$ver"
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC_VERSION=$ver"

      - name: Compile probe installer with ISCC (fail-closed)
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP "w0-inno-probe"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          Set-Content -Path (Join-Path $probeDir "dummy.txt") -Value "btdeck w0 probe"
          $iss = @"
          [Setup]
          AppId={{9A6C1B2D-1111-4222-8333-W0PROBE00001}
          AppName=BtDeckW0Probe
          AppVersion=0.0.1
          DefaultDirName={autopf}\BtDeckW0Probe
          OutputDir=$probeDir
          OutputBaseFilename=w0probe-setup
          PrivilegesRequired=admin
          [Files]
          Source: "$probeDir\dummy.txt"; DestDir: "{app}"
          "@
          $issPath = Join-Path $probeDir "probe.iss"
          # Inno 不接受 UTF-16 BOM 之外的奇字符，统一 ASCII 写入
          [System.IO.File]::WriteAllText($issPath, $iss, (New-Object System.Text.UTF8Encoding($false)))
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $issPath
          if ($LASTEXITCODE -ne 0) { throw "ISCC compile failed" }
          $setup = Join-Path $probeDir "w0probe-setup.exe"
          if (-not (Test-Path $setup)) { throw "probe setup exe not produced" }
          (Get-FileHash $setup -Algorithm SHA256).Hash | Set-Content (Join-Path $probeDir "setup.sha256")

      - name: Silent install / uninstall probe setup
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP "w0-inno-probe"
          $setup = Join-Path $probeDir "w0probe-setup.exe"
          $installDir = "C:\Program Files (x86)\BtDeckW0Probe"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (-not (Test-Path (Join-Path $installDir "dummy.txt"))) { throw "silent install did not place dummy.txt" }
          Write-Output "SILENT_INSTALL_OK"
          $uninst = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninst)) { throw "uninstaller missing" }
          Start-Process -FilePath $uninst -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          if (Test-Path $installDir) { throw "silent uninstall left artifacts" }
          Write-Output "SILENT_UNINSTALL_OK"

      - name: NSSM service lifecycle probe
        shell: pwsh
        run: |
          $nssm = Join-Path $PWD "deploy\nssm.exe"
          if (-not (Test-Path $nssm)) { throw "deploy/nssm.exe missing from checkout" }
          $svc = "BtDeckW0Probe"
          & $nssm install $svc "C:\Windows\System32\cmd.exe" "/c ping -n 9999 127.0.0.1 > NUL"
          if ($LASTEXITCODE -ne 0) { throw "nssm install failed" }
          & $nssm set $svc Start SERVICE_DEMAND_START | Out-Null
          & $nssm start $svc
          if ($LASTEXITCODE -ne 0) { throw "nssm start failed" }
          $status = (& $nssm status $svc) -join ""
          if ($status -notmatch "SERVICE_RUNNING") { throw "service not RUNNING, got: $status" }
          & $nssm stop $svc
          & $nssm remove $svc confirm
          if ($LASTEXITCODE -ne 0) { throw "nssm remove failed" }
          $left = Get-Service -Name $svc -ErrorAction SilentlyContinue
          if ($left) { throw "service still exists after remove" }
          Write-Output "NSSM_LIFECYCLE_OK"

      - name: Write W0 windows report
        shell: pwsh
        run: |
          $report = @{
            probe = "w0-windows-runner"
            runner = "${{ runner.name }}-${{ runner.os }}"
            inno_setup = "${{ env.ISCC_VERSION }}"
            checks = @{
              iscc_compile = "PASS"
              silent_install_uninstall = "PASS"
              nssm_lifecycle = "PASS"
            }
            executed_at = (Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ")
          }
          $report | ConvertTo-Json | Set-Content w0-windows-runner.json

      - name: Write G0 gate fragment
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/build/gate-fragments | Out-Null
          $fragment = @{
            gate = "G0"
            status = "PASS"
            generated_at = (Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ")
            summary = "w0-windows-runner probe: Inno Setup + NSSM lifecycle verified"
            evidence = @(@{ path = "w0-windows-runner.json" })
          }
          $fragment | ConvertTo-Json | Set-Content release/build/gate-fragments/G0.json
          if (-not (Test-Path release/build/gate-fragments/G0.json)) { throw "gate fragment write failed" }

      - name: Upload W0 windows report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0-windows-runner
          path: |
            w0-windows-runner.json
            release/build/gate-fragments/G0.json
          retention-days: 30
          if-no-files-found: error

  w0-linux-systemd:
    name: "W0 probe / Debian 12 + Rocky 9 systemd containers"
    if: ${{ inputs.run_linux_systemd }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build systemd test images (official bases only)
        run: |
          docker build -t w0-debian-systemd - <<'EOF'
          FROM debian:12
          RUN apt-get update && apt-get install -y --no-install-recommends systemd \
              && ln -sf /lib/systemd/systemd /sbin/init \
              && rm -f /etc/machine-id
          CMD ["/sbin/init"]
          EOF
          docker build -t w0-rocky-systemd - <<'EOF'
          FROM rockylinux:9
          RUN dnf -y install systemd && rm -f /etc/machine-id && systemctl set-default multi-user.target
          CMD ["/sbin/init"]
          EOF

      - name: systemd unit lifecycle probe (both distros)
        run: |
          set -euo pipefail
          probe_distro() {
            local image="$1" cname="$2"
            docker run -d --name "$cname" --privileged --cgroupns=host "$image" >/dev/null
            sleep 8
            echo "== $image =="
            docker exec "$cname" systemctl is-system-running || true  # degraded 是容器正常态，非失败
            docker exec "$cname" bash -c 'printf "[Unit]\nDescription=w0 probe\n[Service]\nType=oneshot\nExecStart=/bin/touch /tmp/w0-started\nRemainAfterExit=yes\n[Install]\nWantedBy=multi-user.target\n" > /etc/systemd/system/w0-probe.service'
            docker exec "$cname" systemctl daemon-reload
            docker exec "$cname" systemctl enable --now w0-probe.service
            docker exec "$cname" test -f /tmp/w0-started
            docker exec "$cname" systemctl is-active w0-probe.service | grep -qx active
            docker exec "$cname" systemctl stop w0-probe.service
            test "$(docker exec "$cname" systemctl is-active w0-probe.service)" = inactive
            docker exec "$cname" systemctl disable w0-probe.service
            echo "$image UNIT_LIFECYCLE_OK"
            docker rm -f "$cname" >/dev/null
          }
          probe_distro w0-debian-systemd w0-sysd-deb
          probe_distro w0-rocky-systemd w0-sysd-rocky
          {
            echo '{"probe":"w0-linux-systemd","runner":"${{ runner.name }}","checks":{"debian12_systemd":"PASS","rocky9_systemd":"PASS"},"executed_at":"'$(date -u +%FT%TZ)'"}'
          } > w0-linux-systemd.json

      - name: Write G0 gate fragment
        if: success()
        run: |
          mkdir -p release/build/gate-fragments
          python3 - <<'PY'
          import datetime, json
          json.dump(
              {
                  "gate": "G0",
                  "status": "PASS",
                  "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "summary": "w0-linux-systemd probe: Debian 12 + Rocky 9 systemd lifecycle verified",
                  "evidence": [{"path": "w0-linux-systemd.json"}],
              },
              open("release/build/gate-fragments/G0.json", "w"),
              indent=2,
          )
          PY

      - name: Upload W0 systemd report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0-linux-systemd
          path: |
            w0-linux-systemd.json
            release/build/gate-fragments/G0.json
          retention-days: 30
          if-no-files-found: error

  w0-node-matrix:
    name: "W0 probe / Node 22 frontend matrix"
    if: ${{ inputs.run_node_matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.W0_NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci + full matrix (fail-closed)
        run: |
          node -v && npm -v
          npm ci --legacy-peer-deps
          npm run contract:check
          npm run typecheck
          npm run test:coverage -- --silent
          npm run build
          echo NODE22_CI_MATRIX_PASS

      - name: Write W0 node report
        if: always()
        run: |
          cat > w0-node-matrix.json <<EOF
          {"probe":"w0-node-matrix","node":"$(node -v)","runner":"${{ runner.name }}","executed_at":"$(date -u +%FT%TZ)"}
          EOF

      - name: Write G0 gate fragment
        if: success()
        working-directory: .
        run: |
          mkdir -p release/build/gate-fragments
          python3 - <<'PY'
          import datetime, json
          json.dump(
              {
                  "gate": "G0",
                  "status": "PASS",
                  "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "summary": "w0-node-matrix probe: Node 22 full frontend matrix verified",
                  "evidence": [{"path": "frontend/w0-node-matrix.json"}],
              },
              open("release/build/gate-fragments/G0.json", "w"),
              indent=2,
          )
          PY

      - name: Upload W0 node report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0-node-matrix
          path: |
            frontend/w0-node-matrix.json
            release/build/gate-fragments/G0.json
          retention-days: 30
          if-no-files-found: error

  w0-glibc-bullseye:
    name: "W0 probe / bullseye build + dual-distro run"
    if: ${{ inputs.run_glibc }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend once (probe scope; W2 起由独立 frontend-dist 制品替代)
        run: |
          docker run --rm -v "$PWD:/src" -w /src/frontend node:22-bookworm-slim bash -c "\
            npm ci --legacy-peer-deps && npm run build"

      - name: PyInstaller build in python:3.11-bullseye
        run: |
          docker volume rm w0out >/dev/null 2>&1 || true
          docker run --rm -v "$PWD:/src" -v w0out:/out -w /src python:3.11-bullseye bash -c "\
            pip install --no-cache-dir --prefer-binary -r deploy/requirements-linux-package.txt \
            && pyinstaller --clean --noconfirm --distpath /out --workpath /tmp/pyi-build deploy/btdeck.spec"

      - name: Run binary on Debian 12 + Rocky 9 (fail-closed)
        run: |
          set -euo pipefail
          for distro in debian:12 rockylinux:9; do
            echo "== $distro =="
            docker run --rm -v w0out:/artifacts:ro "$distro" bash -c '
              cp /artifacts/btdeck /tmp/btdeck && chmod +x /tmp/btdeck
              timeout 15 /tmp/btdeck >/tmp/run.log 2>&1 || rc=$?
              rc=${rc:-0}
              grep -q "Application startup complete" /tmp/run.log \
                || { echo "STARTUP FAILED on $1"; cat /tmp/run.log | tail -20; exit 1; }
              echo "rc=$rc STARTUP_OK"
            ' _ "$distro"
          done
          cat > w0-glibc-bullseye.json <<EOF
          {"probe":"w0-glibc-bullseye","build_image":"python:3.11-bullseye","tested":["debian:12","rockylinux:9"],"executed_at":"$(date -u +%FT%TZ)"}
          EOF

      - name: Write G0 gate fragment
        if: success()
        run: |
          mkdir -p release/build/gate-fragments
          python3 - <<'PY'
          import datetime, json
          json.dump(
              {
                  "gate": "G0",
                  "status": "PASS",
                  "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "summary": "w0-glibc-bullseye probe: bullseye build + dual-distro run verified",
                  "evidence": [{"path": "w0-glibc-bullseye.json"}],
              },
              open("release/build/gate-fragments/G0.json", "w"),
              indent=2,
          )
          PY

      - name: Upload W0 glibc report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0-glibc-bullseye
          path: |
            w0-glibc-bullseye.json
            release/build/gate-fragments/G0.json
          retention-days: 30
          if-no-files-found: error

  w2-strict-linux-build:
    name: "W2 strict / Linux binary + DEB + RPM (G4/G5)"
    if: ${{ inputs.run_w2_linux }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (single frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python (release tooling)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build frontend once (single build + manifest)
        run: |
          python scripts/release/build_frontend.py

      - name: Build Linux strict toolchain image (bullseye + fpm + rpmbuild)
        run: |
          docker build -t w2-linux-builder - <<'EOF'
          FROM python:3.11-bullseye
          RUN apt-get update && apt-get install -y --no-install-recommends \
                ruby ruby-dev build-essential git nodejs npm rpm rpm2cpio cpio \
              && rm -rf /var/lib/apt/lists/* \
              && gem install fpm --no-document
          EOF

      - name: Run deploy/build-linux.sh --release (fail-closed)
        run: |
          docker run --rm -v "$PWD:/src" -w /src w2-linux-builder bash -c '
            set -e
            git config --global --add safe.directory /src
            bash deploy/build-linux.sh --release
          '

      - name: Verify release bundle (cross-artifact G1/G5)
        run: |
          docker run --rm -v "$PWD:/src" -w /src w2-linux-builder bash -c '
            set -e
            git config --global --add safe.directory /src
            python3 scripts/release/verify_release_bundle.py
          '

      - name: Upload strict Linux artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-strict-linux
          path: |
            dist/btdeck
            dist/BtDeck-v*-linux-amd64.deb
            dist/BtDeck-v*-linux-amd64.rpm
            release/build/gate-report.json
            release/build/checksums.txt
            release/build/linux-binary/build-info.json
          retention-days: 7
          if-no-files-found: error

  w2-strict-windows-build:
    name: "W2 strict / Windows EXE + Inno Setup (G4/G5)"
    if: ${{ inputs.run_w2_windows }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build frontend once (single build + manifest)
        shell: pwsh
        run: |
          python scripts/release/build_frontend.py
          if ($LASTEXITCODE -ne 0) { throw "frontend single build failed" }

      - name: Ensure Inno Setup available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }

      - name: Run deploy/build-windows.bat --release (fail-closed)
        shell: cmd
        run: deploy\build-windows.bat --release

      - name: Verify EXE version resource carries full SHA
        shell: pwsh
        run: |
          $exe = "dist\btdeck.exe"
          if (-not (Test-Path $exe)) { throw "dist/btdeck.exe missing" }
          $vi = (Get-Item $exe).VersionInfo
          $sha = (Get-Content release\build\windows-exe\build-info.json | ConvertFrom-Json).git_sha
          if ($vi.ProductVersion -ne "1.0.6") { throw "ProductVersion mismatch: $($vi.ProductVersion)" }
          if ($vi.Comments -notmatch $sha) { throw "Comments missing full git sha: $($vi.Comments)" }
          Write-Output "VERSION_RESOURCE_OK ProductVersion=$($vi.ProductVersion) sha=$($sha.Substring(0,12))"

      - name: Upload strict Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-strict-windows
          path: |
            dist/btdeck.exe
            dist/BtDeck-v*-windows-x64-setup.exe
            release/build/windows-exe/build-info.json
          retention-days: 7
          if-no-files-found: error

  w2-strict-docker-build:
    name: "W2 strict / Docker backend+frontend (G4/G5)"
    if: ${{ inputs.run_w2_docker }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (single frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python (release tooling)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build frontend once (single build + manifest)
        run: python scripts/release/build_frontend.py

      - name: Run build-images.sh --release (fail-closed, label verified)
        run: |
          bash build-images.sh --release

      - name: Verify build-info embedded in images
        run: |
          set -euo pipefail
          VERSION=$(python -c "import json;print(json.load(open('release/build/docker-backend/build-info.json'))['product_version'])")
          SHA=$(python -c "import json;print(json.load(open('release/build/docker-backend/build-info.json'))['git_sha'])")
          docker run --rm "btdeck-backend:${VERSION}" python -c "
          import json
          info = json.load(open('/app/build-info.json'))
          assert info['git_sha'] == '${SHA}', info
          print('backend image build-info OK:', info['git_sha'][:12])
          "
          docker run --rm "btdeck-frontend:${VERSION}" sh -c "
          apk add --no-cache -q python3 >/dev/null 2>&1 || true
          python3 -c \"import json; info=json.load(open('/usr/share/nginx/html/build-info.json')); print('frontend image build-info OK:', info['git_sha'][:12])\" 2>/dev/null \
            || grep -q '${SHA}' /usr/share/nginx/html/build-info.json && echo 'frontend image build-info OK (grep)'
          "

      - name: Upload docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-strict-docker
          path: |
            release/build/docker-images.txt
            release/build/docker-backend/build-info.json
            release/build/docker-frontend/build-info.json
          retention-days: 7
          if-no-files-found: error

  w3-lifecycle-linux:
    name: "W3 lifecycle / DEB+RPM (G6)"
    if: ${{ inputs.run_w3_lifecycle_linux }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout (full history + tags for v1.0.5 baseline)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build frontend once
        run: python scripts/release/build_frontend.py

      - name: Build strict Linux packages
        run: |
          docker build -t w2-linux-builder - <<'BUILDEREOF'
          FROM python:3.11-bullseye
          RUN apt-get update && apt-get install -y --no-install-recommends \
                ruby ruby-dev build-essential git nodejs npm rpm rpm2cpio cpio \
              && rm -rf /var/lib/apt/lists/* \
              && gem install fpm --no-document
          BUILDEREOF
          docker run --rm -v "$PWD:/src" -w /src w2-linux-builder bash -c '
            set -e
            git config --global --add safe.directory /src
            bash deploy/build-linux.sh --release
          '

      - name: Prepare v1.0.5 upgrade baseline (reconstructed from tag)
        run: |
          mkdir -p .release-build-v1.0.5/assets
          docker run --rm -v "$PWD:/src" -w /src w2-linux-builder bash scripts/release/lifecycle/make_v105_baseline.sh
          ls -la .release-build-v1.0.5/assets/

      - name: Run DEB/RPM lifecycle scenarios (fail-closed)
        run: BTDECK_SKIP_MIRROR=1 bash scripts/release/lifecycle/run_deb_rpm.sh

      - name: Upload lifecycle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-lifecycle-linux
          path: |
            release/evidence/w3/*.json
            release/evidence/w3/*.container.log
            release/evidence/w3/*.journal.log
          retention-days: 14
          if-no-files-found: error


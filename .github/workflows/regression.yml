name: Full-stack regression

on:
  pull_request:
  push:
    branches: [dev, master, main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 工具链统一 3.12（2026-09-23 契约修订）：目标运行时 3.12
          # 与 Docker/Linux/Windows/Android 制品一致；3.11 已退役
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Architecture checks
        run: python scripts/lint_btdeck.py --show-allowed

      - name: Backend regression suite
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=40

  # ===== v1.0.8 双数据库（任务4.3 强制 PG CI）：真实 PG 集成测试 =====
  # 覆盖：空库基线/重复启动/增量、同步+异步查询、partial index upsert、
  # LIKE 折叠+超时恢复、孤儿 JSON/分组/租约、迁移工具端到端+sequence 校准。
  pg-integration:
    name: PostgreSQL / integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
      # 进程级方言：app.database.DIALECT 导入时常量（tests/pg_integration 门控消费）
      DB_TYPE: postgresql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: btdeck
      DB_PASSWORD: btdeck_ci
      DB_NAME: btdeck_ci
      BTDECK_PG_TEST_ADMIN_DSN: postgresql://btdeck:btdeck_ci@127.0.0.1:5432/postgres

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: btdeck
          POSTGRES_PASSWORD: btdeck_ci
          POSTGRES_DB: btdeck_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U btdeck"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: PostgreSQL integration suite
        run: pytest tests/pg_integration -v

      - name: Enable PostgreSQL TLS acceptance fixture
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/pg-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost \
            -keyout "$RUNNER_TEMP/pg-tls/server.key" -out "$RUNNER_TEMP/pg-tls/server.crt"
          docker cp "$RUNNER_TEMP/pg-tls/server.key" "$PG_CONTAINER:/tmp/server.key"
          docker cp "$RUNNER_TEMP/pg-tls/server.crt" "$PG_CONTAINER:/tmp/server.crt"
          docker exec -u root "$PG_CONTAINER" sh -c 'chown postgres:postgres /tmp/server.key /tmp/server.crt && chmod 600 /tmp/server.key'
          docker exec "$PG_CONTAINER" psql -U btdeck -d btdeck_ci -c "ALTER SYSTEM SET ssl_cert_file='/tmp/server.crt'"
          docker exec "$PG_CONTAINER" psql -U btdeck -d btdeck_ci -c "ALTER SYSTEM SET ssl_key_file='/tmp/server.key'"
          docker exec "$PG_CONTAINER" psql -U btdeck -d btdeck_ci -c "ALTER SYSTEM SET ssl='on'"
          docker exec "$PG_CONTAINER" psql -U btdeck -d btdeck_ci -c 'SELECT pg_reload_conf()'

      - name: PostgreSQL dual-driver TLS matrix
        env:
          BTDECK_PG_TLS_PORT: "5432"
          BTDECK_PG_TLS_CA: ${{ runner.temp }}/pg-tls/server.crt
        run: pytest tests/pg_integration/test_pg_tls.py -v

  frontend:
    name: Frontend / type + Jest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 工具链统一（W1）：与 frontend/package.json engines 对齐（Node 22 线，
          # W0 探针实测 22.23.2 全量矩阵通过）
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript gate
        run: npm run typecheck

      - name: Frontend regression suite and coverage gate
        run: npm run test:coverage -- --silent

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Production build
        run: npm run build

name: Full-stack regression

on:
  pull_request:
  push:
    branches: [dev, master, main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # G3/工具链统一（release-artifact-equivalence-gate W1）：目标运行时 3.11
          # 与 Docker/Linux 制品一致；3.12 不再作为主回归版本
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Architecture checks
        run: python scripts/lint_btdeck.py --show-allowed

      - name: Backend regression suite
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=40

  frontend:
    name: Frontend / type + Jest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 工具链统一（W1）：与 frontend/package.json engines 对齐（Node 22 线，
          # W0 探针实测 22.23.2 全量矩阵通过）
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript gate
        run: npm run typecheck

      - name: Frontend regression suite and coverage gate
        run: npm run test:coverage -- --silent

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Production build
        run: npm run build

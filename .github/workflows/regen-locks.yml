# 一次性锁文件再生（v1.0.7 安全治理批）：依赖升级声明就位后，
# 在有网络的 runner 上再生 backend/requirements-lock.txt（pip-compile
# --generate-hashes）与 frontend/package-lock.json（npm install
# --package-lock-only），并把结果提交回 dev。
# 触发：仅 workflow_dispatch。完成后本 workflow 可归档。
name: Regenerate locks (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate backend requirements-lock.txt
        run: |
          pip install pip-tools
          cd backend
          # 与仓库原生成命令同参（--allow-unsafe --generate-hashes）；
          # 官方 PyPI 与 aliyun 镜像同源同哈希
          pip-compile --allow-unsafe --generate-hashes \
            --output-file=requirements-lock.txt requirements.txt
          head -20 requirements-lock.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate frontend package-lock.json
        run: |
          cd frontend
          npm install --package-lock-only
          git diff --stat package-lock.json

      - name: Sanity check upgraded pins
        run: |
          grep -E '^(pillow|pyjwt|certifi|urllib3|starlette|fastapi)==' backend/requirements-lock.txt || true
          python3 - <<'EOF'
          import json
          lock = json.load(open('frontend/package-lock.json'))
          pkgs = lock.get('packages', {})
          for name in ('node_modules/axios', 'node_modules/js-cookie', 'node_modules/lodash-es',
                       'node_modules/browserslist', 'node_modules/fast-uri', 'node_modules/nanoid',
                       'node_modules/postcss', 'node_modules/source-map-js'):
              entry = pkgs.get(name)
              print(name, '->', entry.get('version') if entry else 'MISSING')
          EOF

      - name: Commit regenerated locks
        run: |
          git config user.name "btdeck-release-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add backend/requirements-lock.txt frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "no lock changes"; exit 0
          fi
          git commit -m "chore(deps): 再生锁文件——安全治理依赖升级（pillow13/pyjwt2.14/certifi/urllib3/setuptools + axios0.32/js-cookie3/lodash-es4.18 及传递依赖）"
          git push

# BtDeck unraid 实机 Compose（database-migration-ui W6 / v1.0.8）
#
# 基于 2026-10-31 用户提供现网配置修正，三处关键变更（其余保持原样）：
# 1. backend healthcheck：curl -f /docs → python3 urllib /health/control-ready
#    - v1.0.8 镜像已移除 curl（2026-10-25 安全治理批）；/docs 非维护感知探针
#    - control-ready 在迁移冻结期返回 200（businessReady=false）——容器保持
#      healthy，不触发重启风暴（W3-8 设计）
# 2. frontend depends_on：service_healthy → service_started
#    - 迁移冻结期业务 API 503，若按 healthy 门控前端将永不启动，维护页
#      /#/maintenance 不可达（W3-8：维护期静态页必须可达）
# 3. 新增 BTD_MIGRATION_MANAGED_RESTART=1：迁移提交后 backend 优雅退出，
#    由 restart: unless-stopped 自动拉起完成激活闭环（runbook §2）
# 4. PostgreSQL 并入主栈（2026-11-06）：backend/frontend/postgres 三容器，
#    backend 以 DB_TYPE=postgresql 直连 postgres 服务（DB_* 约定与
#    docker-compose.postgres.yml / docker-compose.release.postgres.yml 同源）；
#    凭据经 .env 注入（DB_PASSWORD 必填），数据持久化 ./data/postgres，
#    postgres healthy 门控 backend 启动
#
# ⚠️ 镜像要求：btdeck-backend:latest 必须为 dev≥163deca 构建（v1.0.8 未发版，
#    /health/control-ready 与 /api/v1/database/* 均为 dev 新增——旧镜像探针 404
#    会导致容器永 unhealthy）。

version: '3.8'

services:
  # ============================================
  # 后端服务 - FastAPI 应用
  # ============================================
  backend:
    image: btdeck-backend:latest
    container_name: btdeck-backend

    user: root

    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      - LOG_LEVEL=INFO
      # 迁移控制面托管重启 opt-in（提交→退出→本 compose restart 策略拉起→激活 redo）
      - BTD_MIGRATION_MANAGED_RESTART=1
      # PostgreSQL 数据源（v1.0.8；凭据经 .env 注入，DB_PASSWORD 必填）
      - DB_TYPE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-btdeck}
      - DB_PASSWORD=${DB_PASSWORD:?需要在 .env 设置 DB_PASSWORD}
      - DB_NAME=${DB_NAME:-btdeck}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - DB_SSLMODE=${DB_SSLMODE:-prefer}

    ports:
      - "5001:5001"  # API 端口

    volumes:
      # 绑定挂载优先（如果目录存在）
      - ./data/backend/data:/app/data
      - ./data/backend/logs:/app/logs
      - ./data/backend/config:/app/config
      - ./data/backend/backup:/app/backup
      - /mnt/disk3/pt1/:/Downloads/ipan
      - /mnt/disk5/anime/:/Downloads/hpan
      - /mnt/disk2/pt2/:/Downloads/jpan
      - /mnt/disk6/pt3/:/Downloads/kpan
      - /mnt/disk7/pt4/:/Downloads/lpan
      - /mnt/cache:/cache

    networks:
      - btdeck_network

    restart: unless-stopped

    # postgres healthy 门控 backend（backend 自身 control-ready 探针不变）
    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      # 维护感知探针（W3-8）：迁移冻结期 200+businessReady=false；镜像无 curl 用 python3
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health/control-ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # 前端服务 - Nginx 静态文件服务
  # ============================================
  frontend:
    image: btdeck-frontend:latest
    container_name: btdeck-frontend

    environment:
      - TZ=UTC

    ports:
      - "8080:80"  # 前端 Web UI（容器内80端口映射到宿主机8080）

    volumes:
      # Nginx 缓存和日志（使用命名卷）
      - frontend_cache:/var/cache/nginx
      - frontend_logs:/var/log/nginx

    networks:
      - btdeck_network

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

    restart: unless-stopped

    healthcheck:
      # busybox wget 只试 localhost 解析的第一个地址（[::1]），nginx 仅听 IPv4
      # ——必须显式 127.0.0.1，否则假阴性 unhealthy（2026-10-31 W6 实机实证）
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    depends_on:
      backend:
        condition: service_started  # W3-8：维护期 backend 不满足业务 ready 也要起前端（维护页可达）

  # ============================================
  # PostgreSQL 数据库（v1.0.8 主数据源）
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: btdeck-postgres

    environment:
      - POSTGRES_USER=${DB_USER:-btdeck}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?需要在 .env 设置 DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-btdeck}
      - TZ=UTC

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    # NAS 场景资源上限（与 overlay/release 变体同口径）
    shm_size: 256mb
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    networks:
      - btdeck_network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-btdeck} -d ${DB_NAME:-btdeck}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

# ============================================
# 网络配置
# ============================================
networks:
  btdeck_network:
    driver: bridge

# ============================================
# 数据卷配置
# ============================================
volumes:
  frontend_cache:
    driver: local
  frontend_logs:
    driver: local

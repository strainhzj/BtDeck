# BtDeck Full-Stack Docker Compose
# Usage: docker compose up -d
# Docs: https://github.com/strainhzj/BtDeck

services:
  # ==================== 后端服务 ====================
  # FastAPI + Python 3.11
  # 端口：5001 (API服务)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: btdeck-backend:latest
    container_name: btdeck-backend
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Shanghai}
      # SQLite 单 Worker 约束（W2-4 / P0-06）：不要设置 WORKERS>1——
      # 未设置时 btdeck_startup.sh 默认 WORKERS=1。
      # 不能通过启动多个 SQLite Worker 缓解接口卡顿：resource_guard/信号量均为
      # 进程内对象，多 Worker 会使锁与资源准入失效，且各 Worker 都会各自启动
      # scheduler，导致定时任务重复执行。
      # 数据库路径由 CONFIG_DIR=/app/config（Dockerfile 设置）决定，落在持久化卷 config/
      # 不再设无效的 DATABASE_URL（应用不消费此变量）
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # ===== 安全加固透传（W11）：修复 .env.example 指引与 compose 断链 =====
      # DEV 默认 true 保持向后兼容（现有部署升级不崩）；生产加固三件套：
      #   DEV=false + SECRET_KEY=<强随机> + ALLOWED_HOSTS=http(s)://你的域名:8080
      # 三者缺一即拒绝启动（_validate_security_config 强制校验）。
      - DEV=${DEV:-true}
      - SECRET_KEY=${SECRET_KEY:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - DEBUG=${DEBUG:-false}
      # ===== cron 任务治理透传（2026-08-25）：容器内无 .env，须在此透传才可调 =====
      # 超时强制终止开关（true=超过任务 timeout_seconds 即终止；线上误杀长任务时置 false 回滚）
      - CRON_TASK_TIMEOUT_ENFORCE=${CRON_TASK_TIMEOUT_ENFORCE:-true}
      # 心跳进度停滞告警阈值秒（0 关闭；首次触发转储全线程栈定位挂死）
      - SYNC_TASK_PROGRESS_STALL_WARNING_SECONDS=${SYNC_TASK_PROGRESS_STALL_WARNING_SECONDS:-300}
      # tracker 同步单下载器硬熔断秒（0 关闭；超时主动中断该下载器，放行其余）
      - TRACKER_SYNC_DOWNLOADER_TIMEOUT_SECONDS=${TRACKER_SYNC_DOWNLOADER_TIMEOUT_SECONDS:-1800}
    volumes:
      - ./data/backend/data:/app/data
      - ./data/backend/logs:/app/logs
      - ./data/backend/config:/app/config
      - ./data/backend/backup:/app/backup
    networks:
      - btdeck_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m

  # ==================== 前端服务 ====================
  # Nginx + Vue.js 静态文件
  # 端口：${BTDECK_PORT:-8080} (宿主机) -> 80 (容器)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: btdeck-frontend:latest
    container_name: btdeck-frontend
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${BTDECK_PORT:-8080}:80"
    volumes:
      - frontend_cache:/var/cache/nginx
      - frontend_logs:/var/log/nginx
    networks:
      - btdeck_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

# ==================== 网络配置 ====================
networks:
  btdeck_network:
    driver: bridge

# ==================== 数据卷配置 ====================
volumes:
  frontend_cache:
    driver: local
  frontend_logs:
    driver: local
